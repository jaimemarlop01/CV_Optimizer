<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<title>CV Optimizer — Jaime Martínez López</title>
</head>
<body>

<h1>CV <em>Optimizer</em></h1>
<div class="subtitle">Jaime Martínez López — Adaptador de Currículum con IA</div>

<div class="input-section">
  <span class="input-label">Fuente de la oferta</span>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('url')">🔗 URL</div>
    <div class="tab" onclick="switchTab('text')">📋 Texto</div>
  </div>

  <div class="tab-panel active" id="panel-url">
    <input type="text" id="job-url" placeholder="https://www.linkedin.com/jobs/... o cualquier URL de oferta" />
    <div style="margin-top: 10px; font-size: 12px; color: var(--muted); font-family: 'DM Mono', monospace;">
      ↳ LinkedIn, InfoJobs, Indeed, Tecnoempleo, etc.
    </div>
  </div>

  <div class="tab-panel" id="panel-text">
    <textarea id="job-text" placeholder="Pega aquí la descripción completa de la oferta de trabajo...&#10;&#10;Puedes incluir: título del puesto, empresa, requisitos, responsabilidades, habilidades requeridas, etc."></textarea>
  </div>
</div>

<button class="btn-generate" id="gen-btn" onclick="generateCV()">
  <span id="spinner" class="spinner"></span>
  <span id="btn-text">⚡ Generar CV Personalizado</span>
</button>

<div class="error-box" id="error-box"></div>

<div class="output-wrap" id="output-wrap">
  <div class="output-label">Resultado del análisis</div>

  <div class="score-row" id="score-row">
    <div class="score-card">
      <span class="score-num" id="score-match">—</span>
      <div class="score-name">Match con oferta</div>
    </div>
    <div class="score-card">
      <span class="score-num" id="score-skills">—</span>
      <div class="score-name">Skills coincidentes</div>
    </div>
    <div class="score-card">
      <span class="score-num" id="score-keywords">—</span>
      <div class="score-name">Keywords integradas</div>
    </div>
  </div>

  <div id="cv-output" class="cv-output"></div>

  <div class="tip-box" id="tip-box" style="display:none">
    <strong>💡 Consejo de la IA</strong>
    <span id="tip-text"></span>
  </div>

  <div class="actions-row">
    <button class="btn-action" onclick="copyCV()">📋 Copiar CV</button>
    <button class="btn-action" onclick="printCV()">🖨 Imprimir / PDF</button>
    <button class="btn-action" onclick="resetAll()">↩ Nueva oferta</button>
  </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
